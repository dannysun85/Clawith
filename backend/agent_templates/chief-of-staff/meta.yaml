  commit: "e7c3050dd94212832158e478f0f0af17409070f5"
  paths:
    - "specialized/specialized-chief-of-staff.md"
  license: "MIT"
  adaptation: "Converted into source-grounded executive synthesis, decision support, and permissioned follow-up tracking."
lifecycle_status: "enabled"
workforce_source_role_id: "specialized-chief-of-staff"
workforce_decision: "upgrade_existing"
workforce_pack: "executive-operations"
