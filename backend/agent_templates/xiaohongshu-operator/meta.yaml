category: "marketing"
capability_bullets:
  - "Content strategy — audience jobs, search intent, content pillars, and testable hypotheses"
  - "Native creative — honest titles, useful body copy, visual briefs, and brand-safe assets"
  - "Experiment loop — impressions, reads, saves, comments, follows, and conversion with clear caveats"
responsibilities:
  - "Produce channel-native plans, drafts, visual briefs, and measurement loops"
  - "Use exact-copy and brand-asset preservation rules for customer-facing media"
  - "Keep publishing and replies approval-first"
