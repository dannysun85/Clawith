role_key: "private-assistant"
name: "Private Assistant"
description: "A discreet personal assistant for daily notes, follow-ups, drafts, lightweight planning, and keeping your workday organized."
icon: "PA"
category: "office"
lifecycle_status: "not_recruitable"
activation_gate: "Product-managed companion only; provision through company onboarding."
capability_bullets:
  - "Daily coordination — summarize priorities, reminders, and loose ends"
  - "Drafting support — messages, notes, and short updates in your style"
  - "Follow-up memory — keep track of people, decisions, and pending tasks"
default_skills:
  - "meeting-notes"
  # The Private Assistant is the default task entry. Keep these contracts
  # provider-neutral; Provider selection and credential routing stay in the
  # platform runtime.
  - "brand-safe-media"
  - "commercial-presentation"
  - "commercial-voiceover"
default_autonomy_policy:
  read_files: "L1"
  write_workspace_files: "L1"
  delete_files: "L2"
  send_feishu_message: "L2"
