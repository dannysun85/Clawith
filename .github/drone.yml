# ============================================================
# Clawith CI/CD Pipeline
# 基于 Drone CI 的自动化构建、本地部署测试和升级测试
#
# 流程:
#   1. 代码克隆 (获取完整历史和 tags)
#   2. 构建 Docker 镜像
#   3. 本地部署测试 (直接利用本地 docker socket 和 docker-compose.ci.yml)
#   4. 本地升级测试 (测试旧版到新版的迁移)
#   5. 打包传输到服务器 (可选)
# ============================================================
kind: pipeline
type: docker
name: build-and-test

workspace:
  path: /drone/src

clone:
  disable: true

steps:
  # --------------------------------------------------------
  # Step 1: 代码克隆 (获取完整历史和 tags)
  # --------------------------------------------------------
  - name: clone
    image: alpine/git
    pull: if-not-exists
    environment:
      http_proxy:
        from_secret: PROXY
      https_proxy:
        from_secret: PROXY
    commands:
      - set -eu
      - git config --global core.compression 0
      - git config --global http.postBuffer 524288000
      - git clone --no-single-branch "$DRONE_GIT_HTTP_URL" .
      # 将 shallow clone 转换为完整克隆，获取完整 commit 历史
      - git fetch --unshallow --tags || git fetch --tags
      - git checkout --detach $DRONE_COMMIT
      - echo "当前 commit $(git log --oneline -1)"
      - |
        PREVIOUS_RELEASE_TAG=""
        for TAG in $(git tag --merged "$DRONE_COMMIT" --sort=-version:refname); do
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) continue ;;
          esac
          case "$TAG" in
            *-*) continue ;;
          esac
          if [ "$(git rev-list -n 1 "$TAG")" = "$DRONE_COMMIT" ]; then
            continue
          fi
          if [ -n "${DRONE_TAG:-}" ] && [ "$TAG" = "$DRONE_TAG" ]; then
            continue
          fi
          PREVIOUS_RELEASE_TAG="$TAG"
          break
        done
        if [ -z "$PREVIOUS_RELEASE_TAG" ]; then
          echo "未找到当前 commit 之前的正式 Release tag"
          exit 1
        fi
        echo "自动选择升级源版本 $PREVIOUS_RELEASE_TAG"

  # --------------------------------------------------------
  # Step 2: 构建新旧版本 Docker 镜像
  # --------------------------------------------------------
  - name: build-images
    image: docker:24.0.6
    pull: if-not-exists
    privileged: true
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    environment:
      http_proxy:
        from_secret: PROXY
      https_proxy:
        from_secret: PROXY
    commands:
      - apk add --no-cache git
      - |
        set -eu
        PREVIOUS_RELEASE_TAG=""
        for TAG in $(git tag --merged "$DRONE_COMMIT" --sort=-version:refname); do
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) continue ;;
          esac
          case "$TAG" in
            *-*) continue ;;
          esac
          if [ "$(git rev-list -n 1 "$TAG")" = "$DRONE_COMMIT" ]; then
            continue
          fi
          if [ -n "${DRONE_TAG:-}" ] && [ "$TAG" = "$DRONE_TAG" ]; then
            continue
          fi
          PREVIOUS_RELEASE_TAG="$TAG"
          break
        done
        if [ -z "$PREVIOUS_RELEASE_TAG" ]; then
          echo "未找到可用于升级测试的正式 Release tag"
          exit 1
        fi

        COMMIT_SHORT="$(printf '%.8s' "$DRONE_COMMIT")"
        OLD_BACKEND_TAG="ci-$DRONE_BUILD_NUMBER-previous"
        OLD_FRONTEND_TAG="ci-$DRONE_BUILD_NUMBER-previous"
        NEW_BACKEND_TAG="ci-$DRONE_BUILD_NUMBER-$COMMIT_SHORT"
        NEW_FRONTEND_TAG="ci-$DRONE_BUILD_NUMBER-$COMMIT_SHORT"

        echo "构建升级源 $PREVIOUS_RELEASE_TAG"
        git checkout --detach "$PREVIOUS_RELEASE_TAG"
        OLD_COMMIT="$(git rev-parse HEAD)"
        docker build \
          --label "org.opencontainers.image.version=$PREVIOUS_RELEASE_TAG" \
          --label "org.opencontainers.image.revision=$OLD_COMMIT" \
          -t "clawith-backend:$OLD_BACKEND_TAG" \
          --build-arg CLAWITH_PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
          -f backend/Dockerfile ./backend
        docker build \
          --label "org.opencontainers.image.version=$PREVIOUS_RELEASE_TAG" \
          --label "org.opencontainers.image.revision=$OLD_COMMIT" \
          -t "clawith-frontend:$OLD_FRONTEND_TAG" \
          -f frontend/Dockerfile ./frontend

        echo "构建目标 commit $DRONE_COMMIT"
        git checkout --detach "$DRONE_COMMIT"
        docker build \
          --label "org.opencontainers.image.version=${DRONE_TAG:-unreleased}" \
          --label "org.opencontainers.image.revision=$DRONE_COMMIT" \
          -t "clawith-backend:$NEW_BACKEND_TAG" \
          --build-arg CLAWITH_PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
          -f backend/Dockerfile ./backend
        docker build \
          --label "org.opencontainers.image.version=${DRONE_TAG:-unreleased}" \
          --label "org.opencontainers.image.revision=$DRONE_COMMIT" \
          -t "clawith-frontend:$NEW_FRONTEND_TAG" \
          -f frontend/Dockerfile ./frontend

        test "$(docker image inspect "clawith-backend:$NEW_BACKEND_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$DRONE_COMMIT"
        test "$(docker image inspect "clawith-frontend:$NEW_FRONTEND_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$DRONE_COMMIT"
        echo "镜像构建完成 source=$PREVIOUS_RELEASE_TAG target=$DRONE_COMMIT"

  # --------------------------------------------------------
  # Step 3: 本地部署测试 (Deploy Test)
  # --------------------------------------------------------
  - name: local-deploy-test
    image: docker:24.0.6
    privileged: true
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - apk add bash
      - echo "========================================"
      - echo "本地部署测试 全新部署验证"
      - echo "========================================"
      - docker compose -f docker-compose.ci.yml down -v --remove-orphans 2>/dev/null || true
      - echo "启动全部服务 (postgres/redis/backend/frontend)..."
      - IMAGE_TAG=new docker compose -f docker-compose.ci.yml up -d --no-build
      - sleep 5

      # 等待基础设施就绪
      - echo "等待 postgres 和 redis 健康检查通过..."
      - timeout 30s bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" $(docker compose -f docker-compose.ci.yml ps -q postgres) 2>/dev/null)" = "healthy" ]; do sleep 2; done' || (echo "postgres 启动超时" && docker compose -f docker-compose.ci.yml logs postgres && exit 1)
      - timeout 30s bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" $(docker compose -f docker-compose.ci.yml ps -q redis) 2>/dev/null)" = "healthy" ]; do sleep 2; done' || (echo "redis 启动超时" && docker compose -f docker-compose.ci.yml logs redis && exit 1)

      # 核心验证: backend 启动
      - echo "等待 backend 启动 (最多 90 秒)..."
      - timeout 90s bash -c 'until docker compose -f docker-compose.ci.yml logs --tail=200 backend 2>&1 | grep -q "Application startup complete"; do sleep 3; done'
      - RESULT=$?
      - |
        if [ $RESULT -ne 0 ]; then
          echo "❌ 部署测试失败: backend 启动超时"
          docker compose -f docker-compose.ci.yml logs --tail=100 backend
          exit 1
        fi

      # 检查迁移是否失败
      - echo "检查数据库迁移状态..."
      - |
        MIGRATION_LOG=$(docker compose -f docker-compose.ci.yml logs --tail=200 backend 2>&1)
        if echo "$MIGRATION_LOG" | grep -Eqi "migration.*FAIL|alembic.*error"; then
          echo "❌ 部署测试失败: 检测到数据库迁移失败"
          echo "$MIGRATION_LOG" | grep -Ei "migration|alembic|error|FAIL"
          exit 1
        fi

      # 验证 health endpoint (通过 docker compose exec 直接在容器内 curl)
      - echo "验证 health endpoint..."
      - timeout 10s bash -c 'until docker compose -f docker-compose.ci.yml exec -T backend curl -sf http://localhost:8000/api/health > /dev/null 2>&1; do sleep 2; done' || (echo "❌ health endpoint 不可达" && exit 1)

      # 健康检查不能证明 execute_code 可用；实际运行 bubblewrap 沙箱。
      - echo "验证本地 execute_code 沙箱..."
      - docker compose -f docker-compose.ci.yml exec -T -u clawith backend python -m app.scripts.sandbox_smoke

      # 清理环境
      - echo "清理测试环境..."
      - docker compose -f docker-compose.ci.yml down -v --remove-orphans
      - echo "✅ 本地部署测试通过"

  # --------------------------------------------------------
  # Step 4: 本地升级测试 (Upgrade Test)
  # --------------------------------------------------------
  - name: local-upgrade-test
    image: docker:24.0.6
    privileged: true
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - chmod +x .github/scripts/ci_upgrade_test.sh
      - .github/scripts/ci_upgrade_test.sh

  # --------------------------------------------------------
  # Step 5: (可选) 导出镜像并传输到私有服务器
  # 只有在部署测试通过后才会执行到这一步
  # --------------------------------------------------------
  - name: save-images
    image: docker:24.0.6
    privileged: true
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - |
        set -eu
        COMMIT_SHORT="$(printf '%.8s' "$DRONE_COMMIT")"
        docker save -o clawith-backend-new.tar "clawith-backend:ci-$DRONE_BUILD_NUMBER-$COMMIT_SHORT"
        docker save -o clawith-frontend-new.tar "clawith-frontend:ci-$DRONE_BUILD_NUMBER-$COMMIT_SHORT"
        chmod 644 clawith-backend-new.tar clawith-frontend-new.tar
        ls -lh clawith-backend-new.tar clawith-frontend-new.tar
    when:
      branch:
        - main
        - release
      event:
        - push

  - name: scp-images
    image: appleboy/drone-scp
    pull: if-not-exists
    settings:
      host:
        from_secret: PRIVATE_SERVER_IP
      username: root
      password:
        from_secret: sshpwd
      port: 22
      command_timeout: 15m
      target: /opt/server/clawith-ci/
      source:
        - clawith-backend-new.tar
        - clawith-frontend-new.tar
        - docker-compose.ci.yml
      rm: false
    when:
      branch:
        - main
        - release
      event:
        - push

  - name: cleanup-ci-images
    image: docker:24.0.6
    privileged: true
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - |
        COMMIT_SHORT="$(printf '%.8s' "$DRONE_COMMIT")"
        docker image rm "clawith-backend:ci-$DRONE_BUILD_NUMBER-previous" >/dev/null 2>&1 || true
        docker image rm "clawith-frontend:ci-$DRONE_BUILD_NUMBER-previous" >/dev/null 2>&1 || true
        docker image rm "clawith-backend:ci-$DRONE_BUILD_NUMBER-$COMMIT_SHORT" >/dev/null 2>&1 || true
        docker image rm "clawith-frontend:ci-$DRONE_BUILD_NUMBER-$COMMIT_SHORT" >/dev/null 2>&1 || true
    when:
      status:
        - success
        - failure

trigger:
  branch:
    - main
    - release
    - ci/test-drone  # 临时添加，测试完成后删除
    - ci/test-drone-3010  # 本次 3010 隔离与升级流程验证
    - feature/unified-chat-directory-pr760-regression
  event:
    - push
    - pull_request

volumes:
  - name: docker-socket
    host:
      path: /var/run/docker.sock
