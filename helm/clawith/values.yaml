# Default values for clawith
# This is a YAML-formatted file.

# Global settings
global:
  # Namespace to deploy to
  namespace: clawith
  # Optional registry prefix for the application images. Leave empty only
  # when clawith-backend and clawith-frontend are preloaded on every node.
  imageRegistry: ""

# Backend configuration
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: clawith-backend
    tag: latest
    pullPolicy: IfNotPresent

  # The default local execute_code backend uses bubblewrap. Kubernetes must
  # allow nested mounts/user namespaces or execution fails closed. Override
  # this only when every agent uses a remote sandbox backend.
  containerSecurityContext:
    privileged: true
    allowPrivilegeEscalation: true
    seccompProfile:
      type: Unconfined

  service:
    type: ClusterIP
    port: 8000

  # Secrets - will be used if secrets.create is true
  secrets:
    # Both values are required when secrets.create=true. Never commit shared
    # deployment secrets to a values file.
    secretKey: ""
    jwtSecretKey: ""

  # SSL certificates from host (for private/self-signed certificates)
  # Only enable this if you need to mount custom CA certificates
  hostCerts:
    enabled: false
    paths:
      certs: /etc/ssl/certs
      shareCA: /usr/local/share/ca-certificates
    # SSL Certificate paths in container (only used when hostCerts.enabled = true)
    containerPaths:
      sslCertFile: /app/cacert.pem
      requestsCaBundle: /app/cacert.pem
      curlCaBundle: /app/cacert.pem

  # Environment variables for agent
  env:
    # Agent data directory
    agentDataDir: /data/agents
    agentTemplateDir: /app/agent_template
    # v1.11 native Web Chat and Group collaboration use the durable Runtime.
    # Set false only for an intentional allowlist/source-type staged rollout.
    runtimeV2Enabled: true
    runtimeV2AgentIds: ""
    runtimeV2SourceTypes: ""
    runtimeCommandConcurrency: 10
    # Global kill switch for proactive Agent heartbeat. Explicit triggers are unaffected.
    heartbeatEnabled: false
    # Optional explicit egress proxy for credentialed Provider API calls.
    # Keep empty unless the cluster network requires it; do not commit proxy
    # credentials in values files.
    httpProxy: ""
    # Add custom environment variables here
    # custom: {}

  # Persistent storage for agent data
  persistence:
    enabled: true
    # If using existing PVC, set existingClaim
    existingClaim: ""
    # Storage class for dynamic provisioning
    # If empty, uses default storage class
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

  resources: {}
    # limits:
    #   cpu: 2000m
    #   memory: 4Gi
    # requests:
    #   cpu: 500m
    #   memory: 1Gi

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: clawith-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  env:
    # Optional overrides. API_UPSTREAM defaults to the backend Service created
    # by this release. MINIO_UPSTREAM is omitted unless explicitly configured.
    apiUpstream: ""
    minioUpstream: ""

  ingress:
    enabled: false
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    host: clawith.example.com
    tls:
      enabled: false
      secretName: clawith-tls-secret

  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

# PostgreSQL configuration
postgresql:
  enabled: true
  # Set to false if using external PostgreSQL

  image:
    repository: postgres
    registry: docker.io
    tag: 15-alpine
    pullPolicy: IfNotPresent

  auth:
    database: clawith
    username: postgres
    # Required when postgresql.enabled=true. Never ship a shared default.
    # Generate one per deployment, for example: openssl rand -base64 32
    password: ""

  primary:
    service:
      type: ClusterIP
      port: 5432

    persistence:
      enabled: true
      # If using existing PVC, set existingClaim
      existingClaim: ""
      # Storage class for dynamic provisioning
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 8Gi

    resources:
      requests:
        cpu: 250m
        memory: 256Mi

    podSecurityContext: {}

    containerSecurityContext: {}

  # External PostgreSQL settings (if postgresql.enabled = false)
  external:
    host: ""
    port: 5432
    database: clawith
    username: postgres
    password: ""

# Redis configuration
redis:
  enabled: true
  # Set to false if using external Redis

  image:
    repository: redis
    registry: docker.io
    tag: 7-alpine
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6379

  persistence:
    enabled: true
    # If using existing PVC, set existingClaim
    existingClaim: ""
    # Storage class for dynamic provisioning
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi

  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # External Redis settings (if redis.enabled = false)
  external:
    host: ""
    port: 6379
    database: 0
    password: ""

# Secrets configuration
secrets:
  # Create secrets or use existing
  create: true
  # Name of existing secret (if create is false)
  existingSecret: ""

# Storage Class configuration (optional)
# Set createStorageClass to true if you want to create a custom storage class
storageClass:
  create: false
  name: clawith-storage
  provisioner: kubernetes.io/no-provisioner  # Change to your provisioner
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  parameters: {}
    # type: gp2
    # fsType: ext4
