services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_USER: clawith
      POSTGRES_PASSWORD: clawith
      POSTGRES_DB: clawith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clawith" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        CLAWITH_APT_MIRROR: ${CLAWITH_APT_MIRROR:-deb.debian.org}
        CLAWITH_PIP_INDEX_URL: ${CLAWITH_PIP_INDEX_URL:-}
        CLAWITH_PIP_TRUSTED_HOST: ${CLAWITH_PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "1gb"
    command: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://clawith:clawith@postgres:5432/clawith
      REDIS_URL: redis://redis:6379/0
      AGENT_DATA_DIR: /data/agents
      AGENT_TEMPLATE_DIR: /app/agent_template
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/agents
      DOCKER_NETWORK: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_UNVERIFIED_LOCAL_SIGNUP: ${ALLOW_UNVERIFIED_LOCAL_SIGNUP:-false}
      PROCESS_ROLE: all
      AGENT_RUNTIME_COMMAND_CONCURRENCY: ${AGENT_RUNTIME_COMMAND_CONCURRENCY:-10}
      AGENT_RUNTIME_V2_ENABLED: "true"
      AGENT_RUNTIME_V2_AGENT_IDS: ""
      AGENT_RUNTIME_V2_SOURCE_TYPES: ""
      HEARTBEAT_ENABLED: ${HEARTBEAT_ENABLED:-false}
      TRIGGER_DAEMON_ENABLED: ${TRIGGER_DAEMON_ENABLED:-true}
      OKR_AUTOMATION_ENABLED: ${OKR_AUTOMATION_ENABLED:-false}
      TRIGGER_MAX_CONCURRENCY: ${TRIGGER_MAX_CONCURRENCY:-8}
      TRIGGER_CLAIM_BATCH_SIZE: ${TRIGGER_CLAIM_BATCH_SIZE:-16}
      CORS_ORIGINS: '${CORS_ORIGINS:-[]}'
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      SS_CONFIG_FILE: /data/ss-nodes.json
      # Public base URL for constructing OAuth callback URLs and email links.
      # Required when deployed behind a reverse proxy (e.g. Nginx, Cloudflare).
      # If not set, the server infers the URL from the incoming request host.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
      BILLING_USD_CNY_RATE: ${BILLING_USD_CNY_RATE:-7}
      WECHAT_PAY_APPID: ${WECHAT_PAY_APPID:-}
      WECHAT_PAY_MCHID: ${WECHAT_PAY_MCHID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:-}
      WECHAT_PAY_PLATFORM_SERIAL_NO: ${WECHAT_PAY_PLATFORM_SERIAL_NO:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_WEBHOOK_MAX_SKEW_SECONDS: ${WECHAT_PAY_WEBHOOK_MAX_SKEW_SECONDS:-300}
      WECHAT_PAY_ORDER_EXPIRE_MINUTES: ${WECHAT_PAY_ORDER_EXPIRE_MINUTES:-120}
      # Explicit Provider egress proxy; empty is the safe default. This must be
      # identical for API and worker processes when the deployment needs it.
      HTTP_PROXY: ${HTTP_PROXY:-}
      # Platform-scoped models used by native Group planning and threshold-only
      # shared Session Context compaction.
      MULTI_AGENT_PLANNING_MODEL_ID: ${MULTI_AGENT_PLANNING_MODEL_ID:-}
      MULTI_AGENT_COMPACT_MODEL_ID: ${MULTI_AGENT_COMPACT_MODEL_ID:-}
      PLANNING_SYSTEM_COST_MAX_CREDITS_PER_RUN: ${PLANNING_SYSTEM_COST_MAX_CREDITS_PER_RUN:-3000}
      PLANNING_SYSTEM_COST_MAX_CREDITS_PER_TENANT_DAY: ${PLANNING_SYSTEM_COST_MAX_CREDITS_PER_TENANT_DAY:-20000}
      PLANNING_SYSTEM_COST_MAX_CALLS_PER_RUN: ${PLANNING_SYSTEM_COST_MAX_CALLS_PER_RUN:-5}
      PLANNING_SYSTEM_COST_MAX_CALLS_PER_TENANT_DAY: ${PLANNING_SYSTEM_COST_MAX_CALLS_PER_TENANT_DAY:-100}
      PLANNING_SYSTEM_COST_UNPRICED_RESERVATION_CREDITS: ${PLANNING_SYSTEM_COST_UNPRICED_RESERVATION_CREDITS:-1000}
      PLANNING_SYSTEM_COST_INFLIGHT_STALE_SECONDS: ${PLANNING_SYSTEM_COST_INFLIGHT_STALE_SECONDS:-600}
      PLANNING_SYSTEM_COST_RECONCILIATION_SCAN_SECONDS: ${PLANNING_SYSTEM_COST_RECONCILIATION_SCAN_SECONDS:-60}
      PLANNING_SYSTEM_COST_RECONCILIATION_BATCH_SIZE: ${PLANNING_SYSTEM_COST_RECONCILIATION_BATCH_SIZE:-100}
      # Password reset token lifetime in minutes (default: 30)
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
    volumes:
      - ./backend/agent_data:/data/agents
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ss-nodes.json:/data/ss-nodes.json:ro
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3008}:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      API_UPSTREAM: ${API_UPSTREAM:-backend:8000}
      MINIO_UPSTREAM: ${MINIO_UPSTREAM:-minio:9000}
    volumes:
      - ./frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:


networks:
  default:
    name: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
