services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-astra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astra} -d ${POSTGRES_DB:-astra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  backend: &backend-service
    image: ${BACKEND_IMAGE:-astra-backend}:${ASTRA_RELEASE_ID:-local}
    build:
      context: ./backend
      args:
        CLAWITH_APT_MIRROR: ${CLAWITH_APT_MIRROR:-deb.debian.org}
        ASTRA_PIP_INDEX_URL: ${ASTRA_PIP_INDEX_URL:-}
        ASTRA_PIP_TRUSTED_HOST: ${ASTRA_PIP_TRUSTED_HOST:-}
        CLAWITH_PIP_INDEX_URL: ${CLAWITH_PIP_INDEX_URL:-}
        CLAWITH_PIP_TRUSTED_HOST: ${CLAWITH_PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "1gb"
    environment: &backend-environment
      APP_NAME: astra
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-astra}
      REDIS_URL: redis://redis:6379/0
      AGENT_DATA_DIR: /data/agents
      AGENT_TEMPLATE_DIR: /app/agent_template
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ENVIRONMENT: production
      ALLOW_UNVERIFIED_LOCAL_SIGNUP: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      PUBLIC_BASE_URL_ALIASES: ${PUBLIC_BASE_URL_ALIASES:-}
      # Checkout and WeChat notify stay on the payment origin even when the
      # product is also served from opc.reeftotem.ai.
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL:-https://opc.rama-server.com}
      # Provider egress is an explicit release setting. Keep this value
      # identical for the API and inherited worker environment; leave empty
      # when the host has direct public DNS/egress.
      HTTP_PROXY: ${HTTP_PROXY:-}
      ASTRA_RELEASE_VERSION: ${ASTRA_RELEASE_VERSION:-}
      ASTRA_RELEASE_COMMIT: ${ASTRA_RELEASE_COMMIT:-}
      ASTRA_RELEASE_ID: ${ASTRA_RELEASE_ID:-}
      PROCESS_ROLE: ${API_PROCESS_ROLE:-api,bootstrap}
      AGENT_RUNTIME_COMMAND_CONCURRENCY: ${AGENT_RUNTIME_COMMAND_CONCURRENCY:-10}
      # Planning is platform-funded in the design-partner phase. These
      # provider-call budgets are inherited by the worker and are rewritten to
      # safe defaults by the release script on every normal deployment.
      PLANNING_SYSTEM_COST_MAX_CREDITS_PER_RUN: ${PLANNING_SYSTEM_COST_MAX_CREDITS_PER_RUN:-3000}
      PLANNING_SYSTEM_COST_MAX_CREDITS_PER_TENANT_DAY: ${PLANNING_SYSTEM_COST_MAX_CREDITS_PER_TENANT_DAY:-20000}
      PLANNING_SYSTEM_COST_MAX_CALLS_PER_RUN: ${PLANNING_SYSTEM_COST_MAX_CALLS_PER_RUN:-5}
      PLANNING_SYSTEM_COST_MAX_CALLS_PER_TENANT_DAY: ${PLANNING_SYSTEM_COST_MAX_CALLS_PER_TENANT_DAY:-100}
      PLANNING_SYSTEM_COST_UNPRICED_RESERVATION_CREDITS: ${PLANNING_SYSTEM_COST_UNPRICED_RESERVATION_CREDITS:-1000}
      PLANNING_SYSTEM_COST_INFLIGHT_STALE_SECONDS: ${PLANNING_SYSTEM_COST_INFLIGHT_STALE_SECONDS:-600}
      PLANNING_SYSTEM_COST_RECONCILIATION_SCAN_SECONDS: ${PLANNING_SYSTEM_COST_RECONCILIATION_SCAN_SECONDS:-60}
      PLANNING_SYSTEM_COST_RECONCILIATION_BATCH_SIZE: ${PLANNING_SYSTEM_COST_RECONCILIATION_BATCH_SIZE:-100}
      # v1.11.1 supports only the durable Runtime. Do not let a stale release
      # .env silently restore the retired rollout path.
      AGENT_RUNTIME_V2_ENABLED: "true"
      AGENT_RUNTIME_V2_AGENT_IDS: ""
      AGENT_RUNTIME_V2_SOURCE_TYPES: ""
      # A normal production release never activates the CEO rollout or its
      # independent coordination authority. Activation is a separate,
      # tenant-scoped governance operation after production verification.
      CEO_ORCHESTRATOR_ENABLED: "false"
      CEO_ORCHESTRATOR_TENANT_IDS: ""
      CEO_ORCHESTRATOR_AGENT_IDS: ""
      CEO_COORDINATION_ENABLED: "false"
      CEO_COORDINATION_TENANT_IDS: ""
      CEO_COORDINATION_AGENT_IDS: ""
      # Creative V2 workflows remain a separately governed canary. Literal
      # values prevent a polluted host environment or inherited release .env
      # from silently enabling an unverified workflow during deployment.
      DELIVERABLE_POSTER_V2_ENABLED: "false"
      DELIVERABLE_POSTER_V2_TENANT_IDS: ""
      DELIVERABLE_POSTER_V2_AGENT_IDS: ""
      DELIVERABLE_VIDEO_V2_ENABLED: "false"
      DELIVERABLE_VIDEO_V2_TENANT_IDS: ""
      DELIVERABLE_VIDEO_V2_AGENT_IDS: ""
      DELIVERABLE_PRESENTATION_V2_ENABLED: "false"
      DELIVERABLE_PRESENTATION_V2_TENANT_IDS: ""
      DELIVERABLE_PRESENTATION_V2_AGENT_IDS: ""
      ALLOW_MIGRATION_FAILURE: ${ALLOW_MIGRATION_FAILURE:-false}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_LOGIN_LOOKUP_CLIENT_LIMIT_PER_MINUTE: ${AUTH_LOGIN_LOOKUP_CLIENT_LIMIT_PER_MINUTE:-120}
      AUTH_LOGIN_LOOKUP_IDENTIFIER_LIMIT_PER_MINUTE: ${AUTH_LOGIN_LOOKUP_IDENTIFIER_LIMIT_PER_MINUTE:-20}
      AUTH_LOGIN_LOOKUP_GLOBAL_QUERY_UNITS_PER_MINUTE: ${AUTH_LOGIN_LOOKUP_GLOBAL_QUERY_UNITS_PER_MINUTE:-1800}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      AGENTBAY_API_KEY: ${AGENTBAY_API_KEY:-}
      AGENTBAY_ACCESS_KEY_ID: ${AGENTBAY_ACCESS_KEY_ID:-}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-astra_network}
      DOUYIN_CLIENT_KEY: ${DOUYIN_CLIENT_KEY:-}
      DOUYIN_CLIENT_SECRET: ${DOUYIN_CLIENT_SECRET:-}
      DOUYIN_REDIRECT_URI: ${DOUYIN_REDIRECT_URI:-}
      DOUYIN_SCOPES: ${DOUYIN_SCOPES:-user_info,h5.share,aweme.share,aweme.forward,open.get.ticket,video.comment,data.external.user,data.external.item}
      DOUYIN_DIRECT_PUBLISH_ENABLED: ${DOUYIN_DIRECT_PUBLISH_ENABLED:-false}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-https://api.stripe.com}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
      BILLING_RECONCILIATION_INTERVAL_SECONDS: ${BILLING_RECONCILIATION_INTERVAL_SECONDS:-86400}
      BILLING_RESERVATION_EXPIRY_SWEEP_SECONDS: ${BILLING_RESERVATION_EXPIRY_SWEEP_SECONDS:-600}
      BILLING_USD_CNY_RATE: ${BILLING_USD_CNY_RATE:-7}
      WECHAT_PAY_APPID: ${WECHAT_PAY_APPID:-}
      WECHAT_PAY_MCHID: ${WECHAT_PAY_MCHID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:-}
      WECHAT_PAY_PLATFORM_SERIAL_NO: ${WECHAT_PAY_PLATFORM_SERIAL_NO:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_WEBHOOK_MAX_SKEW_SECONDS: ${WECHAT_PAY_WEBHOOK_MAX_SKEW_SECONDS:-300}
      MEDIA_GENERATION_POLL_INTERVAL_SECONDS: ${MEDIA_GENERATION_POLL_INTERVAL_SECONDS:-15}
      MEDIA_GENERATION_BATCH_SIZE: ${MEDIA_GENERATION_BATCH_SIZE:-20}
      MEDIA_GENERATION_SUBMISSION_TIMEOUT_SECONDS: ${MEDIA_GENERATION_SUBMISSION_TIMEOUT_SECONDS:-600}
      MEDIA_GENERATION_MAX_AGE_SECONDS: ${MEDIA_GENERATION_MAX_AGE_SECONDS:-172800}
      MEDIA_GENERATION_MAX_CONSECUTIVE_ERRORS: ${MEDIA_GENERATION_MAX_CONSECUTIVE_ERRORS:-12}
      MEDIA_GENERATION_RECONCILIATION_CONCURRENCY: ${MEDIA_GENERATION_RECONCILIATION_CONCURRENCY:-1}
      MEDIA_GENERATION_TASK_LEASE_SECONDS: ${MEDIA_GENERATION_TASK_LEASE_SECONDS:-1800}
      MEDIA_GENERATION_BRAND_RECOVERY_RETENTION_DAYS: ${MEDIA_GENERATION_BRAND_RECOVERY_RETENTION_DAYS:-30}
      DELIVERABLE_CREATIVE_QUALITY_GATE_REQUIRED: "false"
      DELIVERABLE_CREATIVE_QUALITY_GATE_TENANT_IDS: ""
      DELIVERABLE_CREATIVE_QUALITY_GATE_AGENT_IDS: ""
      PRODUCTION_ISSUE_MONITOR_ENABLED: ${PRODUCTION_ISSUE_MONITOR_ENABLED:-true}
      PRODUCTION_ISSUE_MONITOR_INTERVAL_SECONDS: ${PRODUCTION_ISSUE_MONITOR_INTERVAL_SECONDS:-30}
      PRODUCTION_ISSUE_ALERT_THRESHOLD: ${PRODUCTION_ISSUE_ALERT_THRESHOLD:-1}
      PRODUCTION_ISSUE_RETENTION_DAYS: ${PRODUCTION_ISSUE_RETENTION_DAYS:-30}
      PRODUCTION_ISSUE_ALERT_WEBHOOK_URL: ${PRODUCTION_ISSUE_ALERT_WEBHOOK_URL:-}
      MINIMAX_QUOTA_MONITOR_INTERVAL_SECONDS: ${MINIMAX_QUOTA_MONITOR_INTERVAL_SECONDS:-300}
      # This is the ordinary production release contract, not the separately
      # authorized Code activation surface. Literal values prevent a polluted
      # parent shell environment from overriding the release .env.
      CODE_EXECUTION_ENABLED: "false"
      CODE_EXECUTION_ALLOWED_TENANT_IDS: ""
      CODE_EXECUTION_ALLOWED_TOOL_NAMES: ""
      CODE_EXECUTION_ALLOWED_SANDBOX_TYPES: ""
      CODE_EXECUTION_ALLOWED_SANDBOX_ENDPOINTS: ""
      CODE_EXECUTION_REQUIRE_APPROVAL: "true"
      SANDBOX_TYPE: "e2b"
      SANDBOX_API_KEY: ""
      SANDBOX_API_URL: ""
      SANDBOX_ALLOW_NETWORK: "false"
      SANDBOX_ALLOW_UNSAFE_FALLBACK_WHEN_BWRAP_MISSING: "false"
      HEARTBEAT_ENABLED: ${HEARTBEAT_ENABLED:-false}
      TRIGGER_DAEMON_ENABLED: ${TRIGGER_DAEMON_ENABLED:-true}
      USER_AUTOMATION_EXECUTION_ENABLED: ${USER_AUTOMATION_EXECUTION_ENABLED:-true}
      USER_SCHEDULE_EXECUTION_ENABLED: ${USER_SCHEDULE_EXECUTION_ENABLED:-false}
      USER_TASK_EXECUTION_ENABLED: ${USER_TASK_EXECUTION_ENABLED:-false}
      APPROVAL_EXECUTION_ENABLED: ${APPROVAL_EXECUTION_ENABLED:-true}
      SUPERVISION_EXECUTION_ENABLED: ${SUPERVISION_EXECUTION_ENABLED:-false}
      OKR_AUTOMATION_ENABLED: ${OKR_AUTOMATION_ENABLED:-false}
      FEISHU_WEBHOOK_ENABLED: ${FEISHU_WEBHOOK_ENABLED:-false}
      TEAMS_WEBHOOK_ENABLED: ${TEAMS_WEBHOOK_ENABLED:-false}
      TRIGGER_MAX_CONCURRENCY: ${TRIGGER_MAX_CONCURRENCY:-8}
      TRIGGER_CLAIM_BATCH_SIZE: ${TRIGGER_CLAIM_BATCH_SIZE:-16}
      SAAS_ADMIN_EMAIL: ${SAAS_ADMIN_EMAIL:-admin@reeftotem.ai}
      COMPANY_ASSIGNMENT_RUNNER_ENABLED: ${COMPANY_ASSIGNMENT_RUNNER_ENABLED:-false}
      COMPANY_ASSIGNMENT_RUNNER_INTERVAL_SECONDS: ${COMPANY_ASSIGNMENT_RUNNER_INTERVAL_SECONDS:-120}
      COMPANY_ASSIGNMENT_RUNNER_BATCH_SIZE: ${COMPANY_ASSIGNMENT_RUNNER_BATCH_SIZE:-10}
      COMPANY_ASSIGNMENT_RUNNER_TENANT_IDS: ${COMPANY_ASSIGNMENT_RUNNER_TENANT_IDS:-}
      COMPANY_ASSIGNMENT_RUNNER_PROJECT_IDS: ${COMPANY_ASSIGNMENT_RUNNER_PROJECT_IDS:-}
      COMPANY_ASSIGNMENT_WAITING_REPLY_ESCALATION_MINUTES: ${COMPANY_ASSIGNMENT_WAITING_REPLY_ESCALATION_MINUTES:-60}
      COMPANY_WORK_ORDER_REVIEW_ESCALATION_MINUTES: ${COMPANY_WORK_ORDER_REVIEW_ESCALATION_MINUTES:-15}
      SOCIAL_SIDECAR_BASE_URLS: ${SOCIAL_SIDECAR_BASE_URLS:-}
    volumes:
      - agentdata:/data/agents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      default:
        aliases:
          - ${BACKEND_NETWORK_ALIAS:-backend}

  worker:
    <<: *backend-service
    stop_grace_period: 120s
    environment:
      <<: *backend-environment
      PROCESS_ROLE: ${WORKER_PROCESS_ROLE:-worker,connector}
      # Release-specific causal identity for durable outbox attribution. It is
      # intentionally injected only into the worker, never the API container.
      ASTRA_ALERT_WORKER_ACTOR_ID: ${ASTRA_ALERT_WORKER_ACTOR_ID:?ASTRA_ALERT_WORKER_ACTOR_ID is required}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-backend:8000}
      MINIO_UPSTREAM: ${MINIO_UPSTREAM:-minio:9000}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3008}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - default

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-astra-poc_pgdata}
  redisdata:
    name: ${REDIS_VOLUME:-astra-poc_redisdata}
  agentdata:
    name: ${AGENT_DATA_VOLUME:-astra-poc_agentdata}

networks:
  default:
    name: ${DOCKER_NETWORK:-astra_network}
