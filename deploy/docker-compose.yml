services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_USER: clawith
      POSTGRES_PASSWORD: clawith
      POSTGRES_DB: clawith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clawith" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      args:
        CLAWITH_APT_MIRROR: ${CLAWITH_APT_MIRROR:-deb.debian.org}
        CLAWITH_PIP_INDEX_URL: ${CLAWITH_PIP_INDEX_URL:-}
        CLAWITH_PIP_TRUSTED_HOST: ${CLAWITH_PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "1gb"
    command: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://clawith:clawith@postgres:5432/clawith
      REDIS_URL: redis://redis:6379/0
      AGENT_DATA_DIR: /data/agents
      AGENT_TEMPLATE_DIR: /app/agent_template
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/agents
      DOCKER_NETWORK: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_UNVERIFIED_LOCAL_SIGNUP: ${ALLOW_UNVERIFIED_LOCAL_SIGNUP:-false}
      PROCESS_ROLE: all
      AGENT_RUNTIME_COMMAND_CONCURRENCY: ${AGENT_RUNTIME_COMMAND_CONCURRENCY:-10}
      AGENT_RUNTIME_V2_ENABLED: "true"
      AGENT_RUNTIME_V2_AGENT_IDS: ""
      AGENT_RUNTIME_V2_SOURCE_TYPES: ""
      HEARTBEAT_ENABLED: ${HEARTBEAT_ENABLED:-false}
      TRIGGER_DAEMON_ENABLED: ${TRIGGER_DAEMON_ENABLED:-true}
      USER_AUTOMATION_EXECUTION_ENABLED: ${USER_AUTOMATION_EXECUTION_ENABLED:-true}
      USER_SCHEDULE_EXECUTION_ENABLED: ${USER_SCHEDULE_EXECUTION_ENABLED:-false}
      USER_TASK_EXECUTION_ENABLED: ${USER_TASK_EXECUTION_ENABLED:-false}
      APPROVAL_EXECUTION_ENABLED: ${APPROVAL_EXECUTION_ENABLED:-true}
      SUPERVISION_EXECUTION_ENABLED: ${SUPERVISION_EXECUTION_ENABLED:-false}
      OKR_AUTOMATION_ENABLED: ${OKR_AUTOMATION_ENABLED:-false}
      FEISHU_WEBHOOK_ENABLED: ${FEISHU_WEBHOOK_ENABLED:-false}
      TEAMS_WEBHOOK_ENABLED: ${TEAMS_WEBHOOK_ENABLED:-false}
      MEDIA_GENERATION_POLL_INTERVAL_SECONDS: ${MEDIA_GENERATION_POLL_INTERVAL_SECONDS:-15}
      MEDIA_GENERATION_BATCH_SIZE: ${MEDIA_GENERATION_BATCH_SIZE:-20}
      MEDIA_GENERATION_SUBMISSION_TIMEOUT_SECONDS: ${MEDIA_GENERATION_SUBMISSION_TIMEOUT_SECONDS:-600}
      MEDIA_GENERATION_MAX_AGE_SECONDS: ${MEDIA_GENERATION_MAX_AGE_SECONDS:-172800}
      MEDIA_GENERATION_MAX_CONSECUTIVE_ERRORS: ${MEDIA_GENERATION_MAX_CONSECUTIVE_ERRORS:-12}
      MEDIA_GENERATION_RECONCILIATION_CONCURRENCY: ${MEDIA_GENERATION_RECONCILIATION_CONCURRENCY:-1}
      MEDIA_GENERATION_TASK_LEASE_SECONDS: ${MEDIA_GENERATION_TASK_LEASE_SECONDS:-1800}
      MEDIA_GENERATION_BRAND_RECOVERY_RETENTION_DAYS: ${MEDIA_GENERATION_BRAND_RECOVERY_RETENTION_DAYS:-30}
      DELIVERABLE_CREATIVE_QUALITY_GATE_REQUIRED: ${DELIVERABLE_CREATIVE_QUALITY_GATE_REQUIRED:-false}
      DELIVERABLE_CREATIVE_QUALITY_GATE_TENANT_IDS: ${DELIVERABLE_CREATIVE_QUALITY_GATE_TENANT_IDS:-}
      DELIVERABLE_CREATIVE_QUALITY_GATE_AGENT_IDS: ${DELIVERABLE_CREATIVE_QUALITY_GATE_AGENT_IDS:-}
      PRODUCTION_ISSUE_MONITOR_ENABLED: ${PRODUCTION_ISSUE_MONITOR_ENABLED:-true}
      PRODUCTION_ISSUE_MONITOR_INTERVAL_SECONDS: ${PRODUCTION_ISSUE_MONITOR_INTERVAL_SECONDS:-30}
      PRODUCTION_ISSUE_ALERT_THRESHOLD: ${PRODUCTION_ISSUE_ALERT_THRESHOLD:-1}
      PRODUCTION_ISSUE_RETENTION_DAYS: ${PRODUCTION_ISSUE_RETENTION_DAYS:-30}
      PRODUCTION_ISSUE_ALERT_WEBHOOK_URL: ${PRODUCTION_ISSUE_ALERT_WEBHOOK_URL:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-[]}'
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      SS_CONFIG_FILE: /data/ss-nodes.json
      # Public base URL for constructing OAuth callback URLs and email links.
      # Required when deployed behind a reverse proxy (e.g. Nginx, Cloudflare).
      # If not set, the server infers the URL from the incoming request host.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Explicit Provider egress proxy; empty is the safe default. This must be
      # identical for API and worker processes when the deployment needs it.
      HTTP_PROXY: ${HTTP_PROXY:-}
      # Password reset token lifetime in minutes (default: 30)
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
    volumes:
      - ./backend/agent_data:/data/agents
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ss-nodes.json:/data/ss-nodes.json:ro
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3008}:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      API_UPSTREAM: ${API_UPSTREAM:-backend:8000}
      MINIO_UPSTREAM: ${MINIO_UPSTREAM:-minio:9000}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:


networks:
  default:
    name: ${CLAWITH_DOCKER_NETWORK:-clawith_network}
