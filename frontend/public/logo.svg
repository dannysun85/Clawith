<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-label="Astra">
  <!-- 4-pointed star / north-star "Aster" glyph for Astra -->
  <!-- Top spike (slightly elongated = North Star) -->
  <path d="M12 1.5 L12.9 10.8 L12 11.4 L11.1 10.8 Z"/>
  <!-- Bottom spike -->
  <path d="M12 22.5 L12.9 13.2 L12 12.6 L11.1 13.2 Z"/>
  <!-- Left spike -->
  <path d="M1.5 12 L10.8 12.9 L11.4 12 L10.8 11.1 Z"/>
  <!-- Right spike -->
  <path d="M22.5 12 L13.2 11.1 L12.6 12 L13.2 12.9 Z"/>
  <!-- Center diamond core -->
  <path d="M12 10 L14 12 L12 14 L10 12 Z"/>
  <!-- Diagonal shimmer points (smaller, to make an 8-pointed aster feel) -->
  <path d="M13.4 10.6 L14.2 11.4 L13.4 12.2 L12.6 11.4 Z" opacity="0.85"/>
  <path d="M10.6 10.6 L11.4 9.8 L12.2 10.6 L11.4 11.4 Z" opacity="0.85"/>
  <!-- Orbit ring (270° arc with gap, rotated -30°) -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="0.55"
          stroke-dasharray="42.4 14.1" stroke-linecap="round" opacity="0.45"
          transform="rotate(-30 12 12)"/>
</svg>
